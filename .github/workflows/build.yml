name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Project debug key (keystore/README.md)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set; see keystore/README.md"; exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
      - name: Lint, unit tests, debug APK
        run: ./gradlew --console=plain :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rocklogik-connect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance against the in-process mock, both tracks
        working-directory: tools
        run: |
          python conformance.py --direct
          python conformance.py --direct --track mcu
